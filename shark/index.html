<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharpunk shark runner</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    /* The shark-runner strip, embedded by the home page as an iframe.
       Lifted from the old single-screen landing page with its grid removed:
       here the strip IS the document, so it is a flat box with no --k scaling
       (the page scrolls, so the strip never has to share a viewport with a
       header). Background stays transparent: the embedding page paints behind
       it through the iframe. Skin comes from ?theme= as a class on <html>. */
    /* The document fills whatever height the embedder gives the iframe, and
       the playfield hugs the bottom of it. In a 250px iframe this resolves to
       exactly 250px, so the strip renders identically to before. The embedder
       grows the iframe upward while a dialog is open, which is the only way
       the death modal's 421px of content ever gets room. */
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { touch-action: none; user-select: none; }

    /* per-theme tokens, defaults = the original site's palette */
    :root {
      --water: rgba(61, 140, 220, .35);
      --waterline: rgba(160, 215, 255, .6);
      --pill-bg: #f769ad;
      --pill-fg: #fff;
      --pill-bd: #fff;
      --pill-radius: 6px;
      /* separate from --pill-radius: a pill radius on a panel-sized dialog
         turns it into a lozenge */
      --dialog-radius: 10px;
      --pill-font: ui-monospace, "JetBrains Mono", monospace;
      --accent: #5a1a8f;
    }
    .t-chrome {
      --water: rgba(140, 110, 255, .22);
      --waterline: rgba(214, 200, 255, .5);
      --pill-bg: rgba(255, 255, 255, .1);
      --pill-fg: #f0ebff;
      --pill-bd: rgba(255, 255, 255, .22);
      --pill-radius: 999px;
      --dialog-radius: 24px;
      --accent: #c6b4ff;
    }

    /* fixed, so inside a nested browsing context it hugs the iframe's own
       viewport bottom at any iframe height. Every sprite is positioned in px
       from `bottom`, so no game geometry changes when the iframe grows. */
    #game {
      position: fixed; left: 0; right: 0; bottom: 0;
      /* embedders that want a taller strip pass ?h=; everything in the game
         is positioned in px from the waterline up, so extra height is just
         extra sky and no geometry changes */
      height: var(--strip-h, 250px);
      overflow: hidden; touch-action: none; user-select: none;
    }
    #water {
      position: absolute; bottom: 0; left: 0; right: 0; height: 90px;
      background: var(--water);
      border-top: 2px solid var(--waterline);
      z-index: 1;
    }
    /* --- sprites (sheets are @2x, sized here in logical px) ---
       Animated sheets are horizontal strips of equal cells. `background-size:
       auto 100%` makes one cell exactly the element's width, so the keyframes
       just walk background-position-x by whole cells.
       steps(n, jump-none) lands on both the FIRST and LAST cell, so
       `forwards` holds the real final frame. */
    #game .sprite, #game .decor, #game .part {
      position: absolute;
      background-repeat: no-repeat; background-position: 0 0; background-size: 100% 100%;
    }
    #game .decor { pointer-events: none; }
    #game .sprite { z-index: 2; }
    /* zero-size anchor; parts hang off it. Same z as #water but appended
       later, so the pile paints in front of the tint yet under the shark. */
    #game .pile { width: 0; height: 0; z-index: 1; }

    #game #shark {
      width: 93px; height: 75px;
      background-image: url(/img/sharkswim.webp); background-size: auto 100%;
      transform: scaleX(-1);               /* art faces left; flip to swim right */
      animation: swim .34s steps(2) infinite;
    }
    #game #shark.jump { background-image: url(/img/sharkjump.webp); animation: a-jump .73s steps(9, jump-none) forwards; }
    #game #shark.dive { background-image: url(/img/sharkdive.webp); animation: a-dive .2s  steps(5, jump-none) forwards; }
    #game #shark.surf { background-image: url(/img/sharkdive.webp); animation: a-surf .15s steps(3, jump-none) forwards; }
    /* death is two phases off one 7-cell sheet: the shark flips once (cells
       0-3), then fish circle its head forever (cells 4-6). */
    #game #shark.dead {
      background-image: url(/img/sharkdead.webp);
      animation: a-dead .52s steps(4, jump-none) forwards,
                 a-deadloop .39s steps(3) infinite .52s;
    }
    @keyframes swim   { to { background-position-x: -186px } }
    @keyframes a-jump { to { background-position-x: -744px } }
    @keyframes a-dive { to { background-position-x: -372px } }
    @keyframes a-surf { from { background-position-x: -465px } to { background-position-x: -651px } }
    @keyframes a-dead { to { background-position-x: -279px } }
    @keyframes a-deadloop { from { background-position-x: -372px }
                            to   { background-position-x: -651px } }

    #game .bird { background-image: url(/img/bird.webp); background-size: auto 100%;
                  animation: fly 1.2s steps(3) infinite; }
    @keyframes fly { to { background-position-x: calc(var(--cw) * -3) } }

    .island { background-image: url(/img/island.webp) }
    .cloud  { background-image: url(/img/cloud.webp) }
    .cloud2 { background-image: url(/img/cloud2.webp) }
    .cloud3 { background-image: url(/img/cloud3.webp) }
    .coral  { background-image: url(/img/coral.webp) }
    .fish   { background-image: url(/img/fish.webp); transform: scaleX(-1) }
    .fish2  { background-image: url(/img/fish2.webp) }
    .boat   { background-image: url(/img/boat.webp); transform: scaleX(-1) }
    .rock   { background-image: url(/img/rock.webp) }
    .rock2  { background-image: url(/img/rock2.webp) }

    .ico { display: inline-block; width: 1.3em; height: 1.3em; vertical-align: -0.35em;
           background-repeat: no-repeat; background-position: center; background-size: contain; }

    /* HUD, top-right of the strip */
    #hud {
      position: absolute; top: 10px; right: 12px; z-index: 4;
      display: flex; gap: 8px; align-items: center;
    }
    #score, #msg, #mute, #info {
      font-family: var(--pill-font); font-size: 15px; font-weight: 700; letter-spacing: .06em;
      color: var(--pill-fg); white-space: nowrap;
      background: var(--pill-bg); border: 2px solid var(--pill-bd);
      padding: 5px 12px; border-radius: var(--pill-radius); line-height: 19px;
      backdrop-filter: blur(8px);
    }
    #mute, #info { cursor: pointer; padding: 5px 9px; }
    #mute:focus-visible, #info:focus-visible { outline: 2px solid var(--pill-fg); outline-offset: 2px; }
    .key { color: var(--accent); }
    #hiscore { color: var(--accent); }
    #hiscore::before { content: "|"; color: var(--pill-fg); margin: 0 9px; opacity: .55; }

    #msg {
      position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
      z-index: 3; text-transform: uppercase; font-size: 14px;
    }
    #msg:empty { display: none; }
    .no-score #score { display: none; }

    /* help / death dialog. Sized as a panel, not a pill: the death state
       carries ~420px of content, so it needs its own radius token and a real
       max-width. The embedder grows the iframe while this is open. */
    #help {
      background: var(--pill-bg); color: var(--pill-fg);
      border: 2px solid var(--pill-bd); border-radius: var(--dialog-radius);
      font-family: var(--pill-font); font-size: 15px; font-weight: 700;
      padding: 0; line-height: 1.85; outline: none;
      width: min(92vw, 380px); max-height: 90dvh; overflow: auto;
      backdrop-filter: blur(14px);
    }
    #help::backdrop { background: rgba(8, 6, 15, .72); }
    #hbody { padding: 16px 26px 22px; display: flex; flex-direction: column; }
    #hx {
      align-self: flex-end; margin: -8px -18px -2px 0; cursor: pointer;
      background: none; border: none; color: inherit; font: bold 18px var(--pill-font); outline: none;
    }
    #deadart:not([hidden]) {
      display: flex; align-items: center; justify-content: center;
      width: 92px; height: 92px; border-radius: 50%;
      align-self: center; margin: 2px 0 8px;
      background: #4464a2; border: 2px solid var(--pill-bd);
    }
    .deadico { transform: scale(.86); }
    .deadico {
      display: block; width: 93px; height: 75px;
      background: url(/img/sharkdead.webp) no-repeat; background-size: auto 100%;
      animation: a-deadloop .39s steps(3) infinite;
    }
    #dhead:not([hidden]) { display: block; margin: 0 0 8px; text-align: center; }
    #gameover, #retry, .lbl, #hbody .obs { color: var(--accent); }
    #hbody .obs { font-weight: bold; text-decoration: none; }
    #hbody .obs:hover { text-decoration: underline; }
    #retry:not([hidden]) { display: block; margin: 14px 0 0; text-align: center; }

    /* narrow strip: the HUD row and the centred prompt overlapped, so the
       pills shrink and the prompt drops below them */
    @media (max-width: 720px) {
      #hud { top: 8px; right: 8px; gap: 6px; }
      #score, #mute, #info { font-size: 12px; padding: 4px 8px; line-height: 16px; }
      #hiscore::before { margin: 0 6px; }
      #msg { top: 52px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #game .bird, .deadico { animation: none; }
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="water"></div>
    <span id="shark" class="sprite"></span>

    <div id="hud">
      <span id="score"><span id="cur"></span><span id="hiscore"></span></span>
      <button id="mute" aria-label="Mute music">SOUND ON</button>
      <button id="info" aria-label="How to play">?</button>
    </div>

    <dialog id="help">
      <div id="hbody">
        <button id="hx" aria-label="Close">&#10005;</button>
        <div id="deadart" hidden><i class="deadico"></i></div>
        <b id="dhead" hidden><span id="gameover">GAME OVER</span> &middot; SCORE <span id="dscore"></span></b>
        <div>
          <b class="lbl">CONTROLS</b><br>
          &uarr; / SPACE / TAP / SWIPE &uarr; : Jump<br>
          &darr; / SWIPE &darr; : Dive<br>
          <b class="lbl">OBSTACLES</b><br>
          <i class="ico boat"></i> Dive under the boats<br>
          <i class="ico rock"></i> Jump over the rocks
        </div>
        <div id="retry" hidden>JUMP TO RESTART</div>
      </div>
    </dialog>

    <span id="msg">&uarr; / tap to <span class="key">play</span></span>

    <audio id="bgm" src="/bgm.mp3" loop preload="none"></audio>
    <audio id="oof" src="/oof.mp3" preload="none"></audio>
  </div>

  <script>
    // Shark runner. Coordinate system: y = shark's offset from the waterline
    // (px, positive = airborne, negative = submerged). Waterline = top of #water.
    const params = new URLSearchParams(location.search);
    const theme = params.get('theme');
    if (theme) document.documentElement.className = 't-' + theme;
    // ?score=off: the embedder renders its own big score readout, so the
    // in-strip pill would just duplicate it
    if (params.get('score') === 'off') document.documentElement.classList.add('no-score');
    const stripH = parseInt(params.get('h'), 10);
    if (stripH > 0) document.documentElement.style.setProperty('--strip-h', stripH + 'px');

    const embedded = parent !== window;
    const post = msg => { if (embedded) parent.postMessage(msg, '*'); };

    const WATER = 90, DIVE_Y = -48;
    const game = document.getElementById('game'), sharkEl = document.getElementById('shark'),
          curEl = document.getElementById('cur'), hiEl = document.getElementById('hiscore'),
          msgEl = document.getElementById('msg'),
          bgm = document.getElementById('bgm'), muteEl = document.getElementById('mute'),
          oof = document.getElementById('oof');
    const W = () => game.clientWidth;
    // narrow screens: hug the left edge for maximum reaction time
    const sharkX = () => W() < 625 ? 20 : Math.min(200, W() * 0.25);
    let SHARK_X = sharkX();
    // never re-seat the shark mid-run: crossing the 625px branch would
    // teleport it, possibly straight into an obstacle. Rotating a phone
    // during a run used to do exactly that.
    addEventListener('resize', () => { if (state !== 'run') SHARK_X = sharkX(); });

    muteEl.addEventListener('click', () => {
      bgm.muted = !bgm.muted;
      muteEl.textContent = bgm.muted ? 'SOUND OFF' : 'SOUND ON';
    });

    const helpEl = document.getElementById('help'), infoEl = document.getElementById('info'),
          retryEl = document.getElementById('retry'), dscoreEl = document.getElementById('dscore'),
          deadartEl = document.getElementById('deadart'), dheadEl = document.getElementById('dhead');
    // same dialog serves both roles: info (controls only) and death (adds GAME OVER + retry)
    function openHelp(death) {
      retryEl.hidden = deadartEl.hidden = dheadEl.hidden = !death;
      if (death) dscoreEl.textContent = String(score | 0).padStart(5, '0');
      if (!helpEl.open) helpEl.showModal(); // showModal throws if already open
      // The strip is only 250px tall, so the embedder grows the iframe upward
      // to make room and collapses it again on close. Measure what this state
      // actually needs rather than letting the embedder guess: the death
      // dialog is roughly twice the height of the plain controls one.
      const body = document.getElementById('hbody');
      post({ sharkModal: true, need: Math.ceil(body.scrollHeight / 0.9) + 48 });
    }
    infoEl.addEventListener('click', () => openHelp(false));
    // in death mode a tap/click anywhere in the dialog body counts as the jump
    document.getElementById('hbody').addEventListener('click', e => {
      if (!retryEl.hidden && e.target.id !== 'hx' && !e.target.closest('a')) { helpEl.close(); start(); }
    });
    helpEl.addEventListener('click', e => { if (e.target === helpEl) helpEl.close(); });
    document.getElementById('hx').addEventListener('click', () => helpEl.close());
    helpEl.addEventListener('close', () => {
      post({ sharkModal: false });
      if (state === 'dead') msgEl.innerHTML = 'GAME OVER &middot; &uarr; to <span class="key">restart</span>';
    });

    let state = 'idle', y = 0, vy = 0, diving = false;
    let score = 0, hi = +localStorage.sharkHi || 0, t = 0, obstacles = [];

    // Score readout + reporting, gated on the integer actually changing.
    // score climbs 0.15/frame, so this fires ~9x a second while running and
    // not at all while idle or dead. It also replaces two DOM writes that
    // used to run on every single rAF frame to set the same value.
    const pad5 = n => String(n | 0).padStart(5, '0');
    let lastCur = -1, lastHi = -1, lastState = '';
    function report() {
      const c = score | 0, h = hi | 0;
      if (c === lastCur && h === lastHi && state === lastState) return;
      if (c !== lastCur) curEl.textContent = pad5(c);
      if (h !== lastHi) hiEl.textContent = pad5(h);
      if (state !== lastState) {
        // While a run is live, stop the wheel from chaining out of this frame:
        // a stray trackpad flick over the strip would otherwise scroll the
        // embedding page away and the shark would die unwatched.
        document.documentElement.style.overscrollBehavior = state === 'run' ? 'none' : 'auto';
      }
      lastCur = c; lastHi = h; lastState = state;
      post({ sharkScore: c, sharkHi: h, sharkState: state });
    }

    // Hitboxes, as plain boxes, deliberately tighter than the art. The rock is
    // two boxes because it's a spike: a narrow tip above the surface over a
    // wider body below it.
    const HIT = {
      shark: { x0: 18, x1: 76, y0: -15, y1: 15 },
      boat: [{ x0: 12, x1: 85, y0: -5, y1: 115 }],   // hull to masthead
      rock: [{ x0: 18, x1: 45, y0:  0, y1:  22 },    // tip, above water
             { x0:  8, x1: 58, y0: -60, y1:  0 }],   // body, submerged
    };

    // frame-based physics like the original T-rex, assumes ~60fps
    const GRAV = 0.5, JUMP_V = 11, BASE_SPEED = 6;

    // natural width/height ratio of each sprite sheet, from tools/build-assets.py
    const ASPECT = { island: 0.633, cloud: 2.188, cloud2: 1.438, cloud3: 1.979, bird: 1.458,
                     coral: 0.813, fish: 1.583, fish2: 1.808, boat: 0.808, rock: 0.573, rock2: 0.445 };
    function sprite(cls, h, kind) {
      const el = document.createElement('span');
      el.className = kind + ' ' + cls;
      const w = Math.round(h * ASPECT[cls]);
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      if (cls === 'bird') el.style.setProperty('--cw', w + 'px'); // cell width for @keyframes fly
      return el;
    }

    const SHARK_H = 75;
    function placeShark() {
      sharkEl.style.left = SHARK_X + 'px';
      sharkEl.style.bottom = (WATER + y - SHARK_H / 2) + 'px';
    }

    // class swap drives the CSS animations; only write it on an actual change,
    // otherwise every frame restarts the animation from frame 0
    let sharkState = '';
    function setShark(s) {
      if (s !== sharkState) sharkEl.className = 'sprite' + (s ? ' ' + s : '');
      sharkState = s;
    }

    function jump() {
      if (state !== 'run') return start();
      if (y <= 0 && !diving) vy = JUMP_V;
    }

    function start() {
      if (state === 'dead' || state === 'idle') {
        clearTimeout(deathTimer);
        obstacles.forEach(o => o.el.remove());
        obstacles = []; score = 0; y = 0; vy = 0; diving = false; state = 'run';
        msgEl.textContent = ''; setShark('');
        bgm.volume = 0.1; bgm.play().catch(() => {}); // low volume; needs a user gesture
      }
    }

    function spawn() {
      const boat = Math.random() < 0.5;
      let el;
      if (boat) {
        // sailboat floats with its hull just under the waterline: dive beneath it
        el = sprite('boat', 120, 'sprite');
        el.style.bottom = (WATER - 5) + 'px';
      } else {
        // main rock breaking the surface + smaller rocks piled beneath it
        el = document.createElement('span');
        el.className = 'sprite pile';
        el.style.bottom = '0px';
        for (const [c, h, b, l] of [['rock', 110, 0, 0], ['rock2', 100, -32, -20], ['rock', 110, -45, 28]]) {
          const r = sprite(c, h, 'part');
          r.style.bottom = b + 'px';
          r.style.left = l + 'px';
          el.appendChild(r);
        }
      }
      game.appendChild(el);
      obstacles.push({ el, x: W() + 40, boat });
    }

    // parallax decor: seeded once, recycled by wrapping. bg drifts at 0.3x
    // game speed behind the water; fg at 1.5x in front of the game sprites.
    const decor = [];
    function seedDecor(defs, mult, z, opacity) {
      for (const [cls, size, bottom] of defs) {
        const el = sprite(cls, size, 'decor');
        el.style.bottom = bottom + 'px';
        el.style.zIndex = z;
        if (opacity) el.style.opacity = opacity;
        game.appendChild(el);
        const ambient = ['cloud', 'cloud2', 'cloud3', 'bird', 'fish', 'fish2'].includes(cls);
        decor.push({ el, x: Math.random() * W(), mult, ambient });
      }
    }
    seedDecor([ // sky + horizon, behind the water
      ['island', 60, WATER], ['island', 44, WATER],
      ['cloud', 48, 190], ['cloud2', 36, 210], ['cloud3', 42, 170],
    ], 0.3, 0, 0.55);
    // birds share the sky layer but fly, so they cross 3x faster than the clouds drift
    seedDecor([['bird', 24, 185], ['bird', 20, 205]], 0.9, 0, 0.55);
    seedDecor([ // seabed + swimmers: behind the water, so they read as submerged
      ['coral', 48, -14], ['coral', 38, -10], ['coral', 44, -16], ['coral', 36, -8],
      ['fish', 24, 30], ['fish2', 26, 12], ['fish', 22, 44], ['fish2', 20, 20],
    ], 1.5, 0);
    decor.forEach(d => { d.el.style.left = d.x + 'px'; });

    let deathTimer = 0;
    function die() {
      state = 'dead';
      hi = Math.max(hi, score); localStorage.sharkHi = hi;
      bgm.pause();
      oof.muted = bgm.muted; oof.currentTime = 0; oof.play().catch(() => {});
      // hold the dialog back until the shark has finished flipping
      deathTimer = setTimeout(() => { if (state === 'dead') openHelp(true); }, 520);
    }

    function tick() {
      t++;
      if (state === 'run') {
        score += 0.15;
        // matches Chrome T-rex: start 6, accelerate ~0.001/frame, cap at 13.
        // narrow screen = mobile; 25% slower there for thumb reaction time
        const speed = Math.min(13, BASE_SPEED + score * 0.007) * (W() < 625 ? 0.75 : 1);

        if (y > 0 || vy > 0) { y += vy; vy -= GRAV; if (y < 0 && !diving) { y = 0; vy = 0; } }
        else y += ((diving ? DIVE_Y : 0) - y) * 0.3;

        const last = obstacles[obstacles.length - 1];
        if (!last || last.x < W() - (300 + Math.random() * 400 + speed * 40)) spawn();

        const sx0 = SHARK_X + HIT.shark.x0, sx1 = SHARK_X + HIT.shark.x1,
              sy0 = y + HIT.shark.y0,       sy1 = y + HIT.shark.y1;
        for (const o of obstacles) {
          o.x -= speed;
          o.el.style.left = o.x + 'px'; // vertical position was fixed at spawn
          for (const b of (o.boat ? HIT.boat : HIT.rock)) {
            if (o.x + b.x0 < sx1 && o.x + b.x1 > sx0 && b.y0 < sy1 && b.y1 > sy0) { die(); break; }
          }
        }
        obstacles = obstacles.filter(o => o.x > -60 || (o.el.remove(), false));

        for (const d of decor) {
          d.x -= speed * d.mult;
          if (d.x < -100) d.x = W() + 100;
          d.el.style.left = d.x + 'px';
        }
      } else {
        for (const d of decor) {
          if (!d.ambient) continue;
          d.x -= 0.4 * d.mult; // slowest drift while paused
          if (d.x < -100) d.x = W() + 100;
          d.el.style.left = d.x + 'px';
        }
        if (state === 'idle') y = Math.sin(t / 20) * 4; // idle bob
      }
      // pick the pose. `surf` covers the rise back to the surface after a dive.
      if (state === 'dead') setShark('dead');
      else if (state !== 'run') setShark('');
      else if (y > 0 || vy > 0) setShark('jump');
      else if (diving) setShark('dive');
      else if (y < -2) setShark('surf');
      else setShark('');
      placeShark();
      report();
      requestAnimationFrame(tick);
    }

    function onKey(code, down) {
      if (helpEl.open) {
        if (down && !retryEl.hidden && (code === 'ArrowUp' || code === 'Space')) { helpEl.close(); start(); }
        return;
      }
      if (down && (code === 'ArrowUp' || code === 'Space')) jump();
      if (code === 'ArrowDown') {
        diving = down;
        if (down && state !== 'run') start();
      }
    }
    addEventListener('keydown', e => {
      if (['ArrowUp', 'Space', 'ArrowDown'].includes(e.code)) e.preventDefault();
      onKey(e.code, true);
    });
    addEventListener('keyup', e => onKey(e.code, false));
    // the strip lives in an iframe, so the embedding page forwards key events
    // it captured while focus was outside the frame
    addEventListener('message', e => {
      if (!e.data) return;
      if (e.data.sharkWarm) warm();
      if (e.data.sharkKey) onKey(e.data.sharkKey, e.data.down);
    });

    // touch: swipe up = surface/jump, swipe down = dive (toggle), tap = jump.
    // preventDefault only once a run is live, so the strip does not trap the
    // embedding page's scroll before the player has opted in.
    const isControl = e => e.target.closest('a, button, dialog');
    const SWIPE = 24;
    let startY = null;
    document.addEventListener('touchstart', e => {
      if (isControl(e)) return;
      if (state === 'run') e.preventDefault();
      startY = e.touches[0].clientY;
    }, { passive: false });
    document.addEventListener('touchend', e => {
      if (isControl(e) || startY === null) return;
      const dy = e.changedTouches[0].clientY - startY;
      startY = null;
      if (dy < -SWIPE) { if (diving) diving = false; else jump(); }        // swipe up
      else if (dy > SWIPE) { diving = true; if (state !== 'run') start(); } // swipe down
      else jump();                                                         // tap
    });

    // These sheets are only reachable once a run starts, and together with the
    // death sound they are 141KB. Warming them at page load meant an embedder
    // paid for them even when the strip sits below the fold and is never
    // played, so embedded we wait for the host to say the player can see it.
    // Standalone the game IS the page, so warm right away.
    let warmed = false;
    function warm() {
      if (warmed) return;
      warmed = true;
      for (const n of ['sharkjump', 'sharkdive', 'sharkdead', 'boat', 'rock', 'rock2'])
        new Image().src = '/img/' + n + '.webp';
      oof.load();
    }
    if (!embedded) addEventListener('load', warm);
    // last resort: never let a run begin on cold assets
    addEventListener('keydown', warm, { once: true });
    addEventListener('pointerdown', warm, { once: true });

    tick();
  </script>
</body>
</html>
