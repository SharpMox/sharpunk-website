<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharpunk - Web &amp; Games</title>
  <meta name="description" content="Sharpunk, a small web and games studio. Websites, games, and a shark that will not stop swimming.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ============================================================
       SHARPUNK - home
       Two full-viewport screens that snap: the presentation, then the
       shark strip. One wheel gesture moves a whole screen.
       Dials: DESIGN_VARIANCE 8 - MOTION_INTENSITY 7 - VISUAL_DENSITY 3
       Accent locked to the brand's own violet. This is a deliberate
       purple palette because the brand is purple, not an AI default.
       Glass here is a web approximation (backdrop-filter + layered
       borders + highlights), not Apple's Liquid Glass material.
       Radius rule: interactive controls are full pill, panels 24px.
       Theme: dark, locked (the brand has no light mode).
       ============================================================ */

    @font-face {
      font-family: 'Outfit'; src: url(/fonts/outfit.woff2) format('woff2');
      font-weight: 100 900; font-display: swap;
    }
    @font-face {
      font-family: 'JetBrains Mono'; src: url(/fonts/jetbrains-mono.woff2) format('woff2');
      font-weight: 100 800; font-display: swap;
    }

    :root {
      --bg:      #090615;
      --violet:  #9b7bff;
      --violet-2:#6d4ad6;
      --fg:      #ece8fb;
      --muted:   #9d95bd;
      --glass:   rgba(255, 255, 255, .055);
      --glass-2: rgba(255, 255, 255, .085);
      --edge:    rgba(255, 255, 255, .11);
      --edge-2:  rgba(255, 255, 255, .19);
      --r-panel: 24px;
      --r-pill:  999px;
      --shell:   1340px;
      --strip:   300px;
      /* the colour the strip's own background gradient starts on: the
         section above fades into exactly this so the seam disappears */
      --strip-top: #16113a;
      --display: 'Outfit', system-ui, sans-serif;
      --mono:    'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    /* ---------------- the snap container ----------------
       scroll-snap-type lives on the root, so the viewport is the snap
       container and native scroll restoration, fragment links, Home/End
       and the mobile URL bar all keep working.
       body MUST be overflow-x: clip, not hidden: hidden on one axis
       computes the other to auto, which would make body a scroll
       container that never scrolls, and snap points would resolve
       against it instead of the viewport. Snapping would silently
       do nothing at all. */
    html {
      scroll-behavior: smooth;
      overflow-x: clip;
      scroll-snap-type: y mandatory;
    }
    html.no-snap { scroll-snap-type: none; }

    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--display); font-size: 16px; line-height: 1.65; font-weight: 300;
      -webkit-font-smoothing: antialiased; overflow-x: clip;
    }
    a { color: inherit; }
    ::selection { background: var(--violet); color: #0b0818; }
    .shell { width: 100%; max-width: var(--shell); margin: 0 auto; padding: 0 26px; }
    @media (max-width: 640px) { .shell { padding: 0 18px; } }

    /* min-height, not height: an over-tall screen must be able to grow, or
       the snap gate below cannot measure the overflow. --screen-h is pinned
       from JS so the mobile URL bar cannot move the snap targets mid-flick;
       it falls back to plain dvh with no JS. */
    .screen {
      min-height: var(--screen-h, 100dvh);
      scroll-snap-align: start;
      scroll-snap-stop: always;   /* this is what makes one gesture = one screen */
      position: relative; z-index: 2;
    }

    /* ---------------- aurora field ---------------- */
    .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .aurora i {
      position: absolute; display: block; border-radius: 50%;
      filter: blur(90px); opacity: .55; will-change: transform;
    }
    .aurora .b1 { width: 56vw; height: 56vw; left: -12vw; top: -14vw;
                  background: radial-gradient(circle, #5b2ea6, transparent 68%);
                  animation: drift1 28s ease-in-out infinite; }
    .aurora .b2 { width: 48vw; height: 48vw; right: -10vw; top: 12vh;
                  background: radial-gradient(circle, #3a2a8f, transparent 66%);
                  animation: drift2 34s ease-in-out infinite; }
    .aurora .b3 { width: 44vw; height: 44vw; left: 24vw; bottom: -18vw;
                  background: radial-gradient(circle, #7a3f9e, transparent 70%);
                  animation: drift3 40s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate3d(0,0,0) scale(1); }
                        50%     { transform: translate3d(8vw, 6vh, 0) scale(1.14); } }
    @keyframes drift2 { 0%,100% { transform: translate3d(0,0,0) scale(1.08); }
                        50%     { transform: translate3d(-7vw, 9vh, 0) scale(.92); } }
    @keyframes drift3 { 0%,100% { transform: translate3d(0,0,0) scale(.96); }
                        50%     { transform: translate3d(6vw, -8vh, 0) scale(1.1); } }
    .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background: radial-gradient(ellipse at 50% 0%, transparent, var(--bg) 78%); }

    /* ---------------- glass primitive (web approximation) ---------------- */
    .glass {
      background: linear-gradient(150deg, var(--glass-2), var(--glass));
      border: 1px solid var(--edge);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 24px 60px rgba(6, 4, 16, .55);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      border-radius: var(--r-panel);
    }
    @media (prefers-reduced-transparency: reduce) {
      .glass { background: #14102a; backdrop-filter: none; -webkit-backdrop-filter: none; }
    }

    /* ---------------- nav ----------------
       fixed, not sticky: sticky participates in flow, so its height would
       offset every snap point below it. Out of flow means the snap points
       land exactly on 0 and 1 screen, whatever the nav measures. */
    header {
      position: fixed; top: 16px; left: 0; right: 0;
      z-index: 40; padding: 0 26px;
      pointer-events: none;          /* the transparent band must not eat hero clicks */
    }
    .nav {
      pointer-events: auto;
      max-width: var(--shell); margin: 0 auto; height: 62px;
      display: flex; align-items: center; gap: 26px; padding: 0 12px 0 18px;
      border-radius: var(--r-pill);
    }
    .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; margin-right: auto; }
    .brand img { width: 30px; height: 30px; }
    .brand span { font-weight: 700; letter-spacing: .18em; font-size: 14px; text-transform: uppercase; }
    .nav nav { display: flex; gap: 8px; }
    .nav nav a {
      text-decoration: none; font-size: 13px; color: var(--muted); font-weight: 500;
      padding: 8px 14px; border-radius: var(--r-pill);
      transition: background .3s cubic-bezier(.16,1,.3,1), color .3s;
    }
    .nav nav a:hover, .nav nav a:focus-visible { color: var(--fg); background: var(--glass-2); }
    @media (max-width: 560px) {
      .brand span { display: none; }
      .nav { gap: 10px; padding: 0 8px 0 14px; }
      .nav nav { gap: 2px; }
      .nav nav a { padding: 8px 10px; font-size: 12.5px; }
    }

    /* ---------------- screen one: the presentation ---------------- */
    .s1 { display: grid; align-items: center; padding: 92px 0 40px; }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr);
      gap: 48px; align-items: center;
    }

    /* the wordmark, each line sized to fill the column on its own so neither
       wraps. The figures come from measuring the two strings in Outfit at
       this weight and tracking. */
    h1 {
      margin: 0 0 20px; font-weight: 700; letter-spacing: -.045em; line-height: .92;
      --wm: 9.4vw;                      /* two-column hero */
    }
    @media (max-width: 960px) { h1 { --wm: 16.2vw; } }   /* single column: full shell */
    @media (min-width: 1392px) { h1 { --wm: 135px; } }   /* shell capped, vw would overrun */
    h1 .line { display: block; white-space: nowrap; text-transform: uppercase; }
    h1 .l1 { font-size: var(--wm); }
    /* 0.808 = the ratio of the two strings' set widths, so both lines render
       to the same measure instead of one falling short */
    h1 .l2 { font-size: calc(var(--wm) * .808); }

    /* ---------------- the wordmark glitch ----------------
       At rest: one violet copy sitting BEHIND the word with a small offset,
       like a misregistered print. z-index -1 is what puts it behind; with the
       copy on top it would simply cover the white text, and clipping it to a
       band (the old approach) read as the word being cropped.
       In motion: a 45s loop that is idle almost all of the time, with two
       bursts. steps(1) throughout, so every change is a hard jump rather than
       a slide, which is what makes it read as digital tearing. */
    .ghost { position: relative; display: inline-block; }
    .ghost::before, .ghost::after {
      content: attr(data-text); position: absolute; inset: 0;
      pointer-events: none; z-index: -1;
      /* The resting offset lives in `translate`, NOT in `transform`. The
         keyframes below own `transform`, and a running animation outranks a
         plain :hover rule for the same property, so putting the offset in
         transform is what silently killed the hover. They are separate
         properties and compose, so both work at once. */
      translate: -.018em -.022em;
      transition: translate .3s cubic-bezier(.16,1,.3,1), color .3s;
    }
    .ghost::before {
      color: var(--violet);
      animation: glitch-slice 9s steps(1, end) infinite;
    }
    /* the pink copy only exists inside the chromatic burst */
    .ghost::after {
      color: #f769ad; opacity: 0;
      translate: .018em -.022em;
      animation: glitch-split 9s steps(1, end) infinite;
    }
    .ghost:hover::before { translate: -.055em -.05em; color: #c6b4ff; }
    .ghost:hover::after  { translate: .055em -.05em; }
    /* the word itself shakes during a burst, so the white text moves too
       rather than sitting still behind a moving ghost */
    .ghost { animation: glitch-shake 9s steps(1, end) infinite; }
    /* the two lines tear out of phase so it does not look scripted */
    h1 .l2.ghost, h1 .l2.ghost::before, h1 .l2.ghost::after { animation-delay: -.6s; }

    /* 9s loop, idle almost all of it, so a burst is never far away.
       Variant A at 22% (2.0s in, ~0.3s): tight horizontal slice tearing.
       Variant B at 62% (5.6s in, ~0.3s): violet left, pink right.
       Offsets stay small on purpose: the tell is the hard step between
       frames, not how far anything travels. */
    @keyframes glitch-slice {
      0%, 21.9% { transform: none; clip-path: none; }
      22%   { transform: translate3d(-.045em, -.006em, 0); clip-path: inset(4%  0 78% 0); }
      22.6% { transform: translate3d( .05em,   .005em, 0); clip-path: inset(30% 0 52% 0); }
      23.2% { transform: translate3d(-.052em, -.008em, 0); clip-path: inset(52% 0 30% 0); }
      23.8% { transform: translate3d( .036em,  .007em, 0); clip-path: inset(70% 0 12% 0); }
      24.4% { transform: translate3d(-.028em, -.004em, 0); clip-path: inset(16% 0 66% 0); }
      25%   { transform: translate3d( .044em,  .003em, 0); clip-path: inset(44% 0 40% 0); }
      25.5%, 61.9% { transform: none; clip-path: none; }
      62%   { transform: translate3d(-.058em, 0, 0); clip-path: none; }
      62.8% { transform: translate3d(-.07em,   .005em, 0); }
      63.6% { transform: translate3d(-.04em,  -.005em, 0); }
      64.4%, 100% { transform: none; }
    }
    @keyframes glitch-split {
      0%, 21.9% { opacity: 0; transform: none; clip-path: none; }
      /* the pink layer tears on the opposite bands */
      22.3% { opacity: .9; transform: translate3d(.046em,  .005em, 0); clip-path: inset(22% 0 60% 0); }
      23.5% { opacity: .9; transform: translate3d(-.04em, -.004em, 0); clip-path: inset(58% 0 24% 0); }
      24.7% { opacity: .9; transform: translate3d(.05em,   .004em, 0); clip-path: inset(38% 0 46% 0); }
      25.5%, 61.9% { opacity: 0; transform: none; clip-path: none; }
      62%   { opacity: .95; transform: translate3d(.058em, 0, 0); }
      62.8% { opacity: .95; transform: translate3d(.07em, -.005em, 0); }
      63.6% { opacity: .95; transform: translate3d(.04em,  .005em, 0); }
      64.4%, 100% { opacity: 0; transform: none; }
    }
    @keyframes glitch-shake {
      0%, 21.9% { transform: none; }
      22.4% { transform: translate3d(.005em, 0, 0) skewX(-.9deg); }
      23.4% { transform: translate3d(-.004em, 0, 0) skewX(.7deg); }
      24.6% { transform: translate3d(.003em, 0, 0) skewX(-.45deg); }
      25.5%, 61.9% { transform: none; }
      62.4% { transform: translate3d(-.004em, 0, 0) skewX(.6deg); }
      63.4% { transform: translate3d(.004em, 0, 0) skewX(-.6deg); }
      64.4%, 100% { transform: none; }
    }

    /* click-to-copy address. A button, not a link: it performs an action
       rather than navigating, and aria-live announces the confirmation. */
    .mailcopy {
      font: inherit; color: inherit; letter-spacing: inherit;
      background: none; border: 0; padding: 0; cursor: pointer;
    }
    .mailcopy:hover { color: var(--violet); }
    .mailcopy:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 4px; }
    .mailcopy[data-copied] { color: var(--violet); }
    .hero-mail {
      display: inline-flex; align-items: center;
      font-family: var(--mono); font-size: 12px; letter-spacing: .1em;
      color: var(--muted); margin: 0 0 30px;
    }
    .cta-row { display: flex; flex-wrap: wrap; gap: 14px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
      font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      text-decoration: none; min-width: 132px;
      padding: 16px 30px; border-radius: var(--r-pill); border: 1px solid transparent;
      transition: transform .2s cubic-bezier(.16,1,.3,1), box-shadow .3s, background .3s;
      will-change: transform;
    }
    /* PLAY leads, so it carries the solid weight. WEB and GAMES are the
       matched glass pair behind it. */
    .btn-primary {
      background: linear-gradient(140deg, var(--violet), var(--violet-2));
      color: #0b0818;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.34), 0 14px 34px rgba(109, 74, 214, .34);
    }
    .btn-ghost { background: var(--glass); border-color: var(--edge-2); color: var(--fg); }
    .btn-ghost:hover { background: var(--glass-2); }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; }

    .hero-art { position: relative; display: grid; place-items: center; padding: 20px; }
    .hero-art .well {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 50% 42%, rgba(155,123,255,.24), transparent 62%);
    }
    .hero-art img {
      width: min(100%, 360px); position: relative;
      filter: drop-shadow(0 30px 60px rgba(9, 6, 21, .8));
      /* The mark's fins sweep past the disc, so the element box centre is not
         the disc centre. Measured off the rendered alpha: the dense core sits
         at 51.5% / 49.3%. Spinning about the box centre made it wobble. */
      transform-origin: 51.5% 49.3%;
      animation: orbit 180s linear infinite;
    }
    @keyframes orbit { from { transform: rotate(-40deg); } to { transform: rotate(320deg); } }

    @media (max-width: 960px) {
      .s1 { padding: 88px 0 32px; }
      .hero { grid-template-columns: 1fr; gap: 26px; }
      .hero-art { order: -1; padding: 0; }
      .hero-art img { width: min(52%, 210px); }
      h1 { margin-bottom: 26px; }
      .btn { min-width: 0; flex: 1 1 auto; padding: 15px 20px; }
    }

    /* ---------------- screen two: credits, score, strip ---------------- */
    .s2 { display: grid; grid-template-rows: 1fr auto; }
    /* fades from the page into the exact colour the strip's sky starts on,
       so the two meet with no visible seam and no rule between them */
    .s2-top {
      display: grid;
      background: linear-gradient(180deg,
        rgba(22, 17, 58, 0) 30%,
        rgba(22, 17, 58, .55) 74%,
        var(--strip-top) 100%);
    }
    .s2-in {
      display: grid; grid-template-rows: auto 1fr; min-width: 0;
      /* longhands: the padding shorthand here would zero out the horizontal
         padding .shell sets, and the content would run to the screen edge */
      padding-top: 114px;     /* clears the floating nav */
      padding-bottom: 64px;   /* keeps the score off the waterline */
    }

    /* not on a .glass surface on purpose: repainting a large numeral ~9x a
       second on top of backdrop-filter forces the blur to re-sample every
       one of those frames. tabular-nums keeps the advance fixed so the
       digits never reflow, and contain bounds the invalidation. */
    .readout {
      align-self: center;
      display: flex; flex-wrap: wrap; gap: 20px 72px;
      contain: layout style paint;
    }
    .ro-k {
      display: block; font-family: var(--mono); font-size: 11px;
      letter-spacing: .28em; text-transform: uppercase; color: var(--muted);
      margin-bottom: 6px;
    }
    .ro-n {
      display: block; position: relative;
      font-weight: 700; letter-spacing: -.03em; line-height: .9;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.2rem, 9vw, 7rem);
    }
    /* the wordmark's glitch, on the readout. The offsets are in em so the same
       keyframes work at the wordmark's ~135px and at Best's ~40px.
       No resting clip-path here either: a band that is always on reads as the
       number being cropped rather than as a glitch. */
    .ro-n::before, .ro-n::after {
      content: attr(data-n); position: absolute; inset: 0;
      pointer-events: none; z-index: -1;
    }
    .ro-n::before {
      color: var(--violet); opacity: .85;
      translate: -.012em -.016em;
      animation: glitch-slice 9s steps(1, end) infinite;
    }
    .ro-n::after {
      color: #f769ad; opacity: 0;
      translate: .012em -.016em;
      animation: glitch-split 9s steps(1, end) infinite;
    }
    /* Score and Best tear a beat apart */
    #ro-best::before, #ro-best::after { animation-delay: -.4s; }
    .ro-best .ro-n { font-size: clamp(2.2rem, 5.4vw, 4rem); }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px;
      padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
    }

    .credits {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
      padding: 0 0 16px; border-bottom: 1px solid var(--edge);
      font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }
    .credits a { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
    .credits a:hover { color: var(--violet); }
    .credits a b { color: var(--fg); font-weight: 500; }
    .credits .fill { margin-left: auto; }
    @media (max-width: 960px) {
      .s2-in { padding-top: 88px; }
      .credits .fill { margin-left: 0; }
      .readout { gap: 14px 40px; }
    }

    /* The slot keeps a fixed 250px height and the iframe is absolutely
       positioned against its bottom edge. That is what lets the iframe grow
       upward for a dialog without reflowing anything or moving the strip. */
    .strip-slot { position: relative; height: var(--strip); }
    .strip-slot > iframe {
      position: absolute; left: 0; right: 0; bottom: 0;
      width: 100%; height: var(--strip); border: 0;
      background: linear-gradient(180deg, var(--strip-top) 0%, #1e1749 55%, #140f30 100%);
    }
    /* binary and instant, never transitioned: while expanded the iframe
       covers the credits, and the game's touch-action:none would block touch
       scrolling over all of it */
    .strip-slot.modal { z-index: 90; }
    .strip-slot.modal > iframe { height: var(--modal-h, 100dvh); }

    /* ---------------- liquid metal rim ----------------
       An iridescent specular edge that travels around the pill, after the
       liquid-metal component on metal.jakubantalik.com. That one paints two
       2D canvases per button; this is the CSS equivalent: a conic gradient
       masked down to just the border ring, with a drop-shadow so the bright
       part blooms outward the way the reference does.
       --metal has to be registered with @property: an unregistered custom
       property is not interpolatable, so the sweep would snap rather than
       travel. Without @property support the rim still renders, just static. */
    @property --metal {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }
    .btn, .go { position: relative; }
    .btn::before, .go::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      padding: 1.5px; pointer-events: none;
      background: conic-gradient(from var(--metal),
        transparent 0deg,
        rgba(255, 255, 255, .95) 16deg,
        #f769ad 30deg,
        #9b7bff 48deg,
        rgba(150, 225, 255, .9) 62deg,
        transparent 92deg,
        transparent 186deg,
        rgba(255, 255, 255, .6) 206deg,
        #9b7bff 226deg,
        transparent 262deg,
        transparent 360deg);
      /* keep only the ring: the border box minus the content box */
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      filter: drop-shadow(0 0 5px rgba(155, 123, 255, .5));
      animation: metal-sweep 6s linear infinite;
    }
    @keyframes metal-sweep { to { --metal: 360deg; } }
    /* PLAY sits out; it already leads on colour and does not need the rim */
    .btn-primary::before { content: none; }
    /* GAMES runs the sweep out of phase with WEB so the pair does not read
       as one repeated element. Not half a cycle: the gradient has bright
       arcs roughly 180deg apart, so -3s would land back on itself. */
    .cta-row a:nth-child(3)::before { animation-delay: -2.2s; }

    @media (prefers-reduced-motion: reduce) {
      /* hold the rim still, but keep it */
      .btn::before, .go::before { animation: none; }
      /* the snap fling is UA-driven and is NOT governed by scroll-behavior,
         so disabling snap is the only way to honour the preference */
      html { scroll-behavior: auto; scroll-snap-type: none; }
      .aurora i, .hero-art img { animation: none; }
      /* keep the resting offsets, drop every burst */
      .ghost, .ghost::before, .ro-n::before { animation: none; }
      .ghost::after, .ro-n::after { animation: none; opacity: 0; }
      .btn, .nav nav a { transition: none; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  <div class="veil" aria-hidden="true"></div>

  <header>
    <div class="nav glass">
      <a class="brand" href="/"><img src="/logo.svg" alt=""><span>Sharpunk</span></a>
      <nav>
        <a href="/web/">Web</a>
        <a href="/games/">Games</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- SCREEN ONE -->
    <section class="screen s1" aria-label="Sharpunk, web and games">
      <div class="shell hero">
        <div>
          <h1>
            <span class="line l1 ghost" data-text="Sharpunk">Sharpunk</span>
            <span class="line l2 ghost" data-text="Web &amp; Games">Web &amp; Games</span>
          </h1>
          <button class="mailcopy hero-mail" type="button" data-mail="sharpunk.soft@gmail.com" aria-live="polite">sharpunk.soft@gmail.com</button>
          <div class="cta-row">
            <a class="btn btn-primary magnet" href="#play">Play</a>
            <a class="btn btn-ghost" href="/web/">Web</a>
            <a class="btn btn-ghost" href="/games/">Games</a>
          </div>
        </div>
        <div class="hero-art">
          <span class="well"></span>
          <img src="/logo.svg" alt="The Sharpunk shark logo">
        </div>
      </div>
    </section>

    <!-- SCREEN TWO -->
    <section class="screen s2" id="play" aria-label="Play the shark runner">
      <div class="s2-top">
      <div class="shell s2-in">
        <div class="credits">
          <a href="https://www.instagram.com/pelykhyul/" target="_blank" rel="noopener">Artwork <b>@pelykhyul</b></a>
          <a href="https://www.newgrounds.com/audio/listen/1459250" target="_blank" rel="noopener">Music <b>Sea Shanty 2 (OSRS Remix) by JizzyJazz</b></a>
          <span class="fill"></span>
          <span>Up / space / tap to jump</span>
        </div>
        <div class="readout" aria-hidden="true">
          <div>
            <span class="ro-k">Score</span>
            <span class="ro-n" id="ro-score" data-n="00000">00000</span>
          </div>
          <div class="ro-best">
            <span class="ro-k">Best</span>
            <span class="ro-n" id="ro-best" data-n="00000">00000</span>
          </div>
        </div>
        <p class="sr-only" id="ro-live" aria-live="polite"></p>
      </div>
      </div>

      <div class="strip-slot" id="strip-slot">
        <iframe id="shark-frame" src="/shark/?theme=chrome&amp;score=off&amp;h=300" title="Sharpunk shark runner game"></iframe>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const docEl = document.documentElement;
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ---- pin the screen height ----
         100dvh changes while the mobile URL bar animates, which would move
         the snap targets mid-flick. Only react to a width change or a height
         delta bigger than any URL-bar animation. */
      let lastW = innerWidth, lastH = innerHeight;
      const setH = () => docEl.style.setProperty('--screen-h', innerHeight + 'px');
      setH();
      addEventListener('resize', () => {
        if (Math.abs(innerWidth - lastW) > 0 || Math.abs(innerHeight - lastH) > 120) {
          lastW = innerWidth; lastH = innerHeight; setH();
        }
      });
      addEventListener('orientationchange', () => setTimeout(() => {
        lastW = innerWidth; lastH = innerHeight; setH();
      }, 320));

      /* ---- snap gate ----
         Mandatory snap forbids resting between snap points, so a screen taller
         than the viewport would have an unreachable bottom band. Measure and
         switch snapping off when that happens, rather than guessing with a
         breakpoint. min-height on .screen is what makes the overflow visible
         to getBoundingClientRect. */
      const screens = [...document.querySelectorAll('.screen')];
      let snapOff = false, deb = 0, settle = 0;
      const OFF_AT = 8;   // must overflow by more than this to switch off
      const ON_AT = 0;    // must fit exactly to come back on

      function measure() {
        const vh = docEl.clientHeight;
        let tallest = 0;
        for (const s of screens) {
          const h = s.getBoundingClientRect().height;
          if (h > tallest) tallest = h;
        }
        const over = tallest - vh;
        const next = snapOff ? over > ON_AT : over > OFF_AT;
        if (next === snapOff) return;
        snapOff = next;
        docEl.classList.toggle('no-snap', snapOff);
      }
      function schedule() {
        clearTimeout(deb); clearTimeout(settle);
        deb = setTimeout(measure, 150);
        settle = setTimeout(measure, 450);  // iOS keeps changing dvh after the last resize
      }
      measure();
      requestAnimationFrame(() => requestAnimationFrame(measure));
      addEventListener('load', measure);
      if (document.fonts) document.fonts.ready.then(measure);  // the Outfit swap changes heights
      addEventListener('resize', schedule);
      addEventListener('orientationchange', schedule);
      if (window.visualViewport) visualViewport.addEventListener('resize', schedule);
      // toggling .no-snap has no layout effect, so this cannot re-trigger itself
      new ResizeObserver(schedule).observe(document.body);

      /* click-to-copy address, with a fallback for contexts where the async
         clipboard API is unavailable or refused */
      document.querySelectorAll('.mailcopy').forEach(btn => {
        const addr = btn.dataset.mail, label = btn.textContent;
        let restore = 0;
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(addr);
          } catch {
            const t = document.createElement('textarea');
            t.value = addr; t.setAttribute('readonly', '');
            t.style.cssText = 'position:fixed;top:-9999px;opacity:0';
            document.body.appendChild(t); t.select();
            try { document.execCommand('copy'); } finally { t.remove(); }
          }
          btn.textContent = 'Copied'; btn.dataset.copied = '';
          clearTimeout(restore);
          restore = setTimeout(() => {
            btn.textContent = label; delete btn.dataset.copied;
          }, 1600);
        });
      });

      /* ---- one gesture, one screen ----
         CSS mandatory snap on its own only decides where a scroll LANDS: a
         small wheel tick never leaves screen one's snap zone, so it springs
         straight back. To make a small flick move a whole screen, take the
         wheel and page it deliberately. CSS snap stays underneath and still
         handles touch, keyboard, fragment links and resize.
         The lock ends after 160ms of wheel silence rather than on a timer, so
         one trackpad flick with a second of momentum still counts as one
         gesture instead of racing through both screens. */
      let paging = false, idle = 0;
      addEventListener('wheel', e => {
        if (snapOff || reduce) return;      // free scrolling; do not touch it
        if (e.ctrlKey) return;              // pinch zoom
        if (Math.abs(e.deltaY) < 3) return; // horizontal or noise
        e.preventDefault();
        clearTimeout(idle);
        idle = setTimeout(() => { paging = false; }, 160);
        if (paging) return;
        paging = true;
        const i = Math.round(scrollY / docEl.clientHeight);
        const next = Math.min(screens.length - 1, Math.max(0, i + (e.deltaY > 0 ? 1 : -1)));
        screens[next].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, { passive: false });

      /* ---- magnetic buttons (feedback): they lean toward the pointer ---- */
      if (!reduce) {
        document.querySelectorAll('.magnet').forEach(el => {
          let mx = 0, my = 0, raf = 0;
          const apply = () => { raf = 0; el.style.transform = `translate3d(${mx}px, ${my}px, 0)`; };
          el.addEventListener('pointermove', e => {
            const r = el.getBoundingClientRect();
            mx = (e.clientX - (r.left + r.width / 2)) * .26;
            my = (e.clientY - (r.top + r.height / 2)) * .36;
            if (!raf) raf = requestAnimationFrame(apply);
          });
          el.addEventListener('pointerleave', () => { mx = my = 0; if (!raf) raf = requestAnimationFrame(apply); });
        });
      }

      /* ---- the strip ---- */
      const slot = document.getElementById('strip-slot');
      const frame = document.getElementById('shark-frame');
      const scoreEl = document.getElementById('ro-score');
      const bestEl = document.getElementById('ro-best');
      const liveEl = document.getElementById('ro-live');
      const pad5 = n => String(n | 0).padStart(5, '0');
      let prevState = '', modalOpen = false;

      const setNum = (el, v) => { el.textContent = v; el.dataset.n = v; };

      /* Give a dialog room by growing the iframe upward from its fixed bottom
         edge. h = 2*bottom - vh puts the iframe's centre, where a modal
         <dialog> lands, on the viewport's centre. With screen two snapped the
         slot's bottom is the viewport's bottom, so this is exactly one
         viewport. The slot's own height never changes, so nothing reflows and
         the strip cannot move. */
      function setModal(open, need) {
        open = !!open;
        need = need || 460;
        if (open === modalOpen) return;
        modalOpen = open;
        if (open) {
          const bottom = slot.getBoundingClientRect().bottom;
          const vh = docEl.clientHeight;
          // 2*bottom - vh centres the iframe, and so the dialog, on the
          // viewport. Never shorter than what the child says it needs, and
          // never taller than the run up to the viewport top, so the dialog
          // cannot be pushed off the top edge.
          const h = Math.min(Math.max(2 * bottom - vh, need), Math.max(need, bottom));
          slot.style.setProperty('--modal-h', Math.round(h) + 'px');
          // only if the strip is sitting too high to fit the dialog at all
          if (h > bottom) slot.scrollIntoView({ block: 'end', behavior: 'smooth' });
        }
        slot.classList.toggle('modal', open);
      }
      // a close message that never lands would leave a transparent iframe over
      // the whole screen, swallowing clicks and touch scrolling. Recover.
      frame.addEventListener('load', () => { modalOpen = true; setModal(false); });
      addEventListener('pageshow', () => { modalOpen = true; setModal(false); });

      addEventListener('message', e => {
        if (e.source !== frame.contentWindow || !e.data) return;
        const d = e.data;
        if (typeof d.sharkScore === 'number') {
          setNum(scoreEl, pad5(d.sharkScore));
          setNum(bestEl, pad5(d.sharkHi));
          // announce once per death, never per tick
          if (d.sharkState === 'dead' && prevState !== 'dead')
            liveEl.textContent = `Game over. Score ${d.sharkScore | 0}. Best ${d.sharkHi | 0}.`;
          else if (d.sharkState === 'run' && prevState !== 'run') liveEl.textContent = '';
          prevState = d.sharkState;
        }
        if ('sharkModal' in d) setModal(d.sharkModal, d.need);
      });

      /* ---- forward game keys into the strip while it is on screen ----
         Never swallow a key a focused control owns, and leave PageUp/PageDown/
         Home/End unbound so the keyboard always has a way to scroll. */
      const CONTROL = 'a, button, input, textarea, select, summary, [contenteditable]';
      let framed = false;
      new IntersectionObserver(es => { framed = es[0].isIntersecting; }, { threshold: .6 }).observe(frame);

      /* The strip's jump/dive/death sheets and its death sound are 141KB and
         are only reachable once a run starts, so the game holds them back
         until we say the player can see the strip. Warm them as screen two
         comes into range, which is a whole gesture before anyone can play. */
      let warmWanted = false, warmSent = false;
      const sendWarm = () => {
        if (!warmWanted || warmSent || !frame.contentWindow) return;
        warmSent = true;
        frame.contentWindow.postMessage({ sharkWarm: true }, '*');
      };
      new IntersectionObserver(es => {
        if (es[0].isIntersecting) { warmWanted = true; sendWarm(); }
      }, { rootMargin: '500px' }).observe(frame);
      frame.addEventListener('load', sendWarm);   // in range before it finished loading
      const relay = (e, down) => {
        if (!framed || !['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const a = document.activeElement;
        if (a && a !== document.body && a.matches(CONTROL)) return;
        e.preventDefault();
        frame.contentWindow.postMessage({ sharkKey: e.code, down }, '*');
      };
      addEventListener('keydown', e => relay(e, true));
      addEventListener('keyup', e => relay(e, false));
    })();
  </script>
</body>
</html>
